<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Стенды</title>
<!-- Стенды импортируют настоящий код игры, поэтому персонажи и значки здесь
     ровно те же, что в бою: правишь sprites.js — правится и стенд. -->
<link rel="stylesheet" href="css/icons.css">
<link rel="stylesheet" href="css/preview.css">
</head>
<body>
  <div class="head">
    <div class="tabs" id="tabs"></div>
    <p class="about" id="about"></p>
  </div>
  <div id="stand"></div>
  <!-- Тот же import map, что в index.html: стенд объёмных фигурок поднимает
       настоящий код сцены, а он импортирует Three по имени. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js"
      }
    }
  </script>
  <script type="module" src="preview/shell.js"></script>
</body>
</html>
