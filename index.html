<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Зомби-переполох</title>
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Значок вкладки ставит Game.setupFavicon() из общего реестра иконок:
       здесь он был бы эмодзи, то есть картинкой операционной системы. -->
  <link rel="icon" href="data:,">
</head>
<body>
  <!-- Игровой мир. Холста два, потому что один и тот же canvas не может
       отдать и 2D-контекст, и WebGL: браузер выдаёт только тот, что запросили
       первым. Поэтому обычный режим рисует на #game-canvas, объёмный — на
       #scene-canvas, а лишний прячется. -->
  <canvas id="game-canvas"></canvas>
  <canvas id="scene-canvas" class="canvas-off"></canvas>
  <!-- Сердечки, шкалы и счётчики. Отдельным холстом, чтобы объёмный режим мог
       забрать нижний под себя целиком, не переписывая HUD. -->
  <canvas id="hud-canvas"></canvas>

  <!-- Кнопки доступны всегда, поверх любого экрана -->
  <!-- Содержимое кнопок ставит код: значки рисует js/render/icons.js, а не
       шрифт операционной системы. Здесь они пустые, чтобы при медленной
       загрузке модулей не мелькнул чужой глиф. -->
  <button id="sound-button" class="sound-button" title="Звук"></button>
  <button id="pause-button" class="sound-button pause-button hidden" title="Пауза"></button>

  <!-- Управление пальцем: показывается только на сенсорных устройствах -->
  <div id="touch-controls" class="hidden">
    <div id="touch-field"><div id="touch-marker"></div></div>
    <button id="touch-ability" type="button"></button>
  </div>

  <!-- Экраны-оверлеи. Содержимое рендерят модули из js/screens/ -->
  <div id="menu-overlay" class="overlay hidden"></div>
  <div id="players-overlay" class="overlay hidden"></div>
  <div id="difficulty-overlay" class="overlay hidden"></div>
  <div id="view-overlay" class="overlay hidden"></div>
  <div id="characters-overlay" class="overlay hidden"></div>
  <div id="weapons-overlay" class="overlay hidden"></div>
  <div id="cards-overlay" class="overlay hidden"></div>
  <div id="shop-overlay" class="overlay hidden"></div>
  <div id="end-overlay" class="overlay hidden"></div>
  <div id="album-overlay" class="overlay hidden"></div>
  <div id="journeys-overlay" class="overlay hidden"></div>
  <div id="map-overlay" class="overlay hidden"></div>
  <div id="story-overlay" class="overlay hidden"></div>
  <div id="pause-overlay" class="overlay hidden"></div>
  <div id="confirm-overlay" class="overlay hidden"></div>

  <!-- Объёмный режим (docs/render3d.md). Единственная внешняя библиотека в
       проекте, поэтому она лежит в репозитории и грузится с диска: игра
       обязана работать без интернета. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js"
      }
    }
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
