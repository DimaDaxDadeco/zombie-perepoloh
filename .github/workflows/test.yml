# Автопроверка игровой логики.
#
# Логика игры не трогает DOM, поэтому раунд прогоняется в Node без браузера, и
# вся проверка занимает полминуты. Зависимостей у проекта нет — ни npm ci, ни
# кеша здесь не нужно, только сам Node.
#
# Два шага с разной строгостью, и это намеренно:
#   • смоук ВАЛИТ сборку — падение означает поломку;
#   • балансная сетка только печатает числа. Баланс двигают сознательно, и
#     тест, валящийся из-за решения заказчика, был бы помехой.
name: Тесты

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Смоук — каждый герой каждым оружием
        run: npm test

      - name: Балансная сетка (отчёт, сборку не валит)
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm run balance | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
